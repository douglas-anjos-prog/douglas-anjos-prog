  </text>

  <rect x="82" y="204" width="330" height="42" rx="21" fill="#161B22" stroke="#30363D"/>
  <text x="105" y="232" fill="#58A6FF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">
    PHP  •  JavaScript  •  MySQL
  </text>

  <text x="84" y="278" fill="#C9D1D9" font-family="Arial, Helvetica, sans-serif" font-size="18">
