<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" role="img" aria-label="Douglas dos Anjos - Desenvolvedor de Sistemas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#151A2F"/>
      <stop offset="1" stop-color="#241B45"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="0.5" stop-color="#7C6CF6"/>
      <stop offset="1" stop-color="#F778BA"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1220" cy="70" r="150" fill="#7C6CF6" opacity=".08"/>
  <circle cx="1300" cy="300" r="220" fill="#58A6FF" opacity=".06"/>

  <g opacity=".22" stroke="#8B949E" stroke-width="1">
    <path d="M0 70H1400M0 140H1400M0 210H1400M0 280H1400"/>
    <path d="M100 0V360M300 0V360M500 0V360M700 0V360M900 0V360M1100 0V360M1300 0V360"/>
  </g>

  <path d="M70 292 C260 210 310 330 470 250 S720 185 860 245 S1120 330 1325 145"
        fill="none" stroke="url(#line)" stroke-width="3" opacity=".9" filter="url(#glow)"/>
  <circle cx="70" cy="292" r="5" fill="#58A6FF"/>
  <circle cx="1325" cy="145" r="5" fill="#F778BA"/>

  <text x="80" y="125" fill="#F0F6FC" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700">
