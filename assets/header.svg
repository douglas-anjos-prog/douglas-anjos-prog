  </text>

  <g transform="translate(1090 72)">
    <rect width="190" height="190" rx="24" fill="#0D1117" stroke="#30363D"/>
    <text x="25" y="50" fill="#7C6CF6" font-family="monospace" font-size="16">developer</text>
    <text x="25" y="80" fill="#8B949E" font-family="monospace" font-size="16">status:</text>
    <text x="98" y="80" fill="#3FB950" font-family="monospace" font-size="16">building</text>
    <text x="25" y="110" fill="#8B949E" font-family="monospace" font-size="16">focus:</text>
    <text x="25" y="137" fill="#F0F6FC" font-family="monospace" font-size="16">real problems</text>
    <text x="25" y="167" fill="#8B949E" font-family="monospace" font-size="16">coffee: ☕</text>
